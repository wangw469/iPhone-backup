name: Build IPA

# 每次 push / 手动触发都在云端 macOS runner 上打出未签名 IPA
# 不需要自备 Mac。签名在本地用 SideStore / iloader 以免费 Apple ID 完成。
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify Info.plist wiring
        run: |
          grep -a "INFOPLIST_FILE" VideoWiper.xcodeproj/project.pbxproj

      - name: Build app (no signing)
        run: |
          xcodebuild \
            -project VideoWiper.xcodeproj \
            -scheme VideoWiper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Inject photo permission strings
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "APP=$APP"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string '需要访问相册以统计和删除视频。删除前请确认已备份。'" "$APP/Info.plist" || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription '需要访问相册以统计和删除视频。删除前请确认已备份。'" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string '需要访问相册以删除视频。'" "$APP/Info.plist" || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription '需要访问相册以删除视频。'" "$APP/Info.plist"

      - name: Verify built Info.plist
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "APP=$APP"
          plutil -p "$APP/Info.plist" | grep -E "NSPhotoLibraryUsageDescription" || (echo "PRIVACY KEYS MISSING FROM BUILT Info.plist:"; plutil -p "$APP/Info.plist"; exit 1)

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "APP=$APP"
          test -n "$APP"
          rm -rf Payload VideoWiper-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r VideoWiper-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoWiper-unsigned-ipa
          path: VideoWiper-unsigned.ipa
